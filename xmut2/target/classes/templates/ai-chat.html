<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{layout :: header('AI智能助手')}">
    <!-- 添加必要的CSS依赖 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>

<main class="container" th:insert="~{::content}">
    <div th:fragment="content">
        <div class="dashboard-container">
            <div class="panel-header">
                <h1 class="panel-title">AI智能助手</h1>
                <p class="panel-subtitle">理工爱心超市智能服务系统</p>
            </div>
            
            <div class="panel-content">
                <div class="row">
                    <div class="col-md-8">
                        <div class="section-container">
                            <div class="section-header">
                                <h2 class="section-title">
                                    <i class="fas fa-comments"></i> AI聊天助手
                                </h2>
                                <span class="clear-button" onclick="clearChat()">
                                    <i class="fas fa-trash-alt"></i> 清空对话
                                </span>
                            </div>
                            
                            <div class="chat-container" id="chatContainer">
                                <div class="message ai-message">
                                    <div class="message-content">
                                        <i class="fas fa-robot"></i>
                                        您好！我是您的AI助手，有什么可以帮助您的吗？
                                    </div>
                                </div>
                            </div>
                            
                            <div class="typing-indicator" id="typingIndicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            
                            <div class="message-input-container">
                                <textarea class="message-input" id="messageInput" 
                                          placeholder="请输入您的问题..." rows="2"></textarea>
                                <button class="btn-send" id="sendButton" onclick="sendMessage()">
                                    <i class="fas fa-paper-plane"></i> 发送
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="section-container function-card" onclick="showProductRecommendation()">
                            <div class="function-icon">
                                <i class="fas fa-magic"></i>
                            </div>
                            <h3 class="function-title">商品推荐语生成</h3>
                            <p class="function-description">
                                输入您的商品描述，AI将生成专业的推荐语，帮助提升销量。
                            </p>
                        </div>
                        
                        <div class="section-container function-card" onclick="showProductQA()">
                            <div class="function-icon">
                                <i class="fas fa-question-circle"></i>
                            </div>
                            <h3 class="function-title">商品问答助手</h3>
                            <p class="function-description">
                                输入商品信息和顾客问题，获取专业回答。
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- 商品推荐语模态框 -->
<div class="modal fade" id="productRecommendationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-magic"></i>
                    商品推荐语生成
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="productDesc" class="form-label">商品描述</label>
                    <textarea class="form-control" id="productDesc" rows="5" 
                              placeholder="请输入商品的详细描述，包括特点、材质、用途等..."></textarea>
                </div>
                <div class="result-container" id="recommendationResult" style="display: none;">
                    <label class="form-label">生成结果</label>
                    <div class="result-content" id="recommendationText"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="spinner-border text-primary" role="status" id="recommendationSpinner" style="display: none;">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <button type="button" class="btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn-primary" id="generateRecommendationBtn" onclick="generateRecommendation()">
                    <i class="fas fa-magic"></i>
                    生成推荐语
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 商品问答模态框 -->
<div class="modal fade" id="productQAModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-question-circle"></i>
                    商品问答助手
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="productInfo" class="form-label">商品信息</label>
                    <textarea class="form-control" id="productInfo" rows="4" 
                              placeholder="请输入商品的详细信息..."></textarea>
                </div>
                <div class="form-group">
                    <label for="customerQuestion" class="form-label">顾客问题</label>
                    <textarea class="form-control" id="customerQuestion" rows="2" 
                              placeholder="请输入顾客的问题..."></textarea>
                </div>
                <div class="result-container" id="qaResult" style="display: none;">
                    <label class="form-label">AI回答</label>
                    <div class="result-content" id="qaAnswerText"></div>
                </div>
            </div>
            <div class="modal-footer">
                <div class="spinner-border text-primary" role="status" id="qaSpinner" style="display: none;">
                    <span class="visually-hidden">加载中...</span>
                </div>
                <button type="button" class="btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn-primary" id="generateAnswerBtn" onclick="generateAnswer()">
                    <i class="fas fa-reply"></i>
                    获取回答
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    /* 全局样式 */
    body {
        background-color: #f0f4f8;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #333;
        background-image: url('http://img.netbian.com/file/2024/0614/003651lvurh.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        min-height: 100vh;
    }
    
    /* 隐藏顶部导航栏的主页按钮 */
    body header nav a[href$="/"] {
        display: none !important;
    }
    
    /* 通过类选择器确保隐藏 */
    body header nav .nav-link:not(.logout-link) {
        display: none !important;
    }
    
    .container {
        padding-top: 20px;
        padding-bottom: 20px;
    }
    
    /* 仪表板容器 */
    .dashboard-container {
        max-width: 1200px;
        margin: 30px auto;
        background-color: rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    /* 面板头部 */
    .panel-header {
        padding: 25px 0;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

    }

        color: #2c3e50;
        margin: 0;
        font-size: 28px;
        font-weight: 600;
    }
    
    .panel-subtitle {

        margin: 8px 0 0;

    }
    
    /* 面板内容 */
    .panel-content {
        padding: 30px;
        background-color: #ffffff;
    }
    
    /* 区块容器 */
    .section-container {
        background-color: #f9f9f9;

        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        margin-bottom: 20px;
        height: 100%;
    }
    
    .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }
    
    .section-title {
        color: #2c3e50;
        font-size: 18px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .section-title i {
        color: #2980b9;
    }
    
    /* 聊天容器 */
    .chat-container {
        height: 500px;
        overflow-y: auto;
        padding: 15px;
        background-color: #fff;
        border-radius: 8px;
        border: 1px solid #eee;

    /* 消息样式 */
    .message {

        display: flex;
        flex-direction: column;
    }
    
    .message-content {
        padding: 12px 16px;

        max-width: 80%;

        word-wrap: break-word;
    }
    
    .user-message {
        align-items: flex-end;
    }
    
    .user-message .message-content {
        background-color: #2980b9;
        color: white;
    }
    
    .ai-message {
        align-items: flex-start;
    }
    
    .ai-message .message-content {
        background-color: #f0f4f8;
        color: #2c3e50;
    }
    
    .ai-message .message-content i {
        margin-right: 8px;

    }
    
    /* 输入区域 */
    .message-input-container {

        gap: 10px;
    }
    
    .message-input {
        flex: 1;
        padding: 12px;

        border-radius: 8px;
        font-size: 16px;
        resize: none;
        transition: all 0.3s ease;
    }
    
    .message-input:focus {
        border-color: #2980b9;
        box-shadow: 0 0 0 2px rgba(41, 128, 185, 0.1);
        outline: none;
    }
    
    .btn-send {
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0 20px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }
    
    .btn-send:hover {
        background-color: #1c5980;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    /* 功能卡片 */
    .function-card {
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
        padding: 25px 20px;
        height: 100%;
    }
    
    .function-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }
    
    .function-icon {
        font-size: 36px;
        color: #2980b9;
        margin-bottom: 15px;
    }
    
    .function-title {
        color: #2c3e50;
        font-size: 18px;
        margin-bottom: 10px;
    }
    
    .function-description {
        color: #666;
        font-size: 14px;
        margin: 0;
    }
    
    /* 清空按钮 */
    .clear-button {
        color: #666;
        cursor: pointer;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: color 0.3s ease;
        white-space: nowrap;
    }
    
    .clear-button:hover {
        color: #d93025;
    }
    
    /* 输入中指示器 */
    .typing-indicator {
        display: none;
        margin: 10px 0;
        padding: 10px;
    }
    
    .typing-indicator span {
        height: 8px;
        width: 8px;
        background-color: #2980b9;
        border-radius: 50%;
        display: inline-block;
        margin-right: 5px;
        animation: pulse 1.5s infinite;
    }
    
    .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
    }
    
    .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
    }
    
    @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
    }
    
    /* 模态框样式优化 */
    .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1050;
    }
    
    .modal.show {
        display: flex;
    }
    
    .modal-dialog {
        margin: 1.75rem auto;
        max-width: 600px;
        width: 90%;
        position: relative;
    }
    
    .modal-content {
        position: relative;
        background-color: #fff;
        border-radius: 16px;
        border: none;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        overflow: hidden;
    }
    
    .modal-header {
        background-color: #f8f9fa;
        border-bottom: 1px solid #e9ecef;
        padding: 1.25rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    
    .modal-title {
        color: #2c3e50;
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .modal-title i {
        color: #2980b9;
        font-size: 1.5rem;
    }
    
    .btn-close {
        padding: 0.5rem;
        margin: -0.5rem -0.5rem -0.5rem auto;
        background: transparent;
        border: 0;
        opacity: 0.5;
        transition: opacity 0.2s;
    }
    
    .btn-close:hover {
        opacity: 0.75;
    }
    
    .modal-body {
        padding: 1.5rem;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-label {
        color: #2c3e50;
        font-weight: 500;
        margin-bottom: 0.5rem;
        display: block;
    }
    
    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        line-height: 1.5;
        color: #495057;
        background-color: #fff;
        border: 1px solid #ced4da;
        border-radius: 8px;

    }
    
    .form-control:focus {
        border-color: #2980b9;
        box-shadow: 0 0 0 0.2rem rgba(41, 128, 185, 0.25);
        outline: 0;
    }
    
    .result-container {
        margin-top: 1.5rem;
        background-color: #f8f9fa;
        border-radius: 8px;
        padding: 1rem;
    }
    
    .result-content {
        color: #2c3e50;
        font-size: 1rem;
        line-height: 1.6;

    .modal-footer {

        background-color: #f8f9fa;

        gap: 0.75rem;

    .btn-primary, .btn-secondary {
        padding: 0.75rem 1.5rem;

        font-weight: 500;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
    }
    
    .btn-primary {
        background-color: #2980b9;
        color: #fff;
        border: none;
    }
    
    .btn-primary:hover {
        background-color: #1c5980;
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .btn-secondary {
        background-color: #e9ecef;
        color: #495057;
        border: 1px solid #ced4da;
    }
    
    .btn-secondary:hover {
        background-color: #dee2e6;
        transform: translateY(-1px);
    }
    
    .spinner-border {
        width: 1.5rem;
        height: 1.5rem;

        }

            padding: 20px;
        }
        
        .chat-container {
            height: 400px;
        }
        
        .message-content {
            max-width: 90%;
        }
        
        .function-card {
            padding: 20px 15px;
        }
        
        .message-input-container {

        }
        
        .btn-send {
            width: 100%;
            justify-content: center;
            padding: 12px;

</style>

<!-- 添加必要的JavaScript依赖 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>

<script>
    let sessionId = null;
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const typingIndicator = document.getElementById('typingIndicator');
    let productRecommendationModal, productQAModal;

    window.onload = function() {
        // 初始化模态框
        productRecommendationModal = new bootstrap.Modal(document.getElementById('productRecommendationModal'), {
            backdrop: 'static',
            keyboard: false
        });
        productQAModal = new bootstrap.Modal(document.getElementById('productQAModal'), {
            backdrop: 'static',
            keyboard: false
        });
        
        // 创建会话ID
        fetch('/api/ai/chat/sessions', {
            method: 'POST'
        })
        .then(response => response.json())
        .then(data => {
            sessionId = data.sessionId;
            console.log("会话已创建，ID:", sessionId);
        })
        .catch(error => {
            console.error('创建会话出错:', error);
        });

        // 回车键发送消息
        messageInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });
    }

    function sendMessage() {
        const message = messageInput.value.trim();
        if (message === '') return;

        // 添加用户消息
        addMessage(message, 'user');
        messageInput.value = '';

        // 显示输入中指示器
        typingIndicator.style.display = 'block';
        
        // 请求AI回复
        fetch(`/api/ai/chat?sessionId=${sessionId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message: message })
        })
        .then(response => response.json())
        .then(data => {
            // 隐藏输入中指示器
            typingIndicator.style.display = 'none';
            
            // 添加AI回复
            addMessage(data.reply, 'ai');
        })
        .catch(error => {
            console.error('获取AI回复出错:', error);
            typingIndicator.style.display = 'none';
            addMessage('抱歉，服务出现了问题，请稍后再试。', 'ai');
        });
    }

    function addMessage(text, sender) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
        messageDiv.innerHTML = `
            <div class="message-content">
                <i class="fas fa-${sender === 'user' ? 'user' : 'robot'}"></i>
                ${text}
            </div>
        `;
        
        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function clearChat() {
        // 清空聊天容器
        while (chatContainer.firstChild) {
            chatContainer.removeChild(chatContainer.firstChild);
        }
        
        // 添加初始消息
        addMessage('您好！我是您的AI助手，有什么可以帮助您的吗？', 'ai');
        
        // 清除会话历史
        if (sessionId) {
            fetch(`/api/ai/chat/sessions/${sessionId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(() => {
                console.log("会话历史已清除");
            })
            .catch(error => {
                console.error('清除会话历史出错:', error);
            });
        }
    }

    function showProductRecommendation() {
        document.getElementById('productDesc').value = '';
        document.getElementById('recommendationResult').style.display = 'none';
        productRecommendationModal.show();
    }

    function showProductQA() {
        document.getElementById('productInfo').value = '';
        document.getElementById('customerQuestion').value = '';
        document.getElementById('qaResult').style.display = 'none';
        productQAModal.show();
    }

    function generateRecommendation() {
        const productDesc = document.getElementById('productDesc').value.trim();
        if (productDesc === '') return;

        const spinner = document.getElementById('recommendationSpinner');
        const button = document.getElementById('generateRecommendationBtn');
        
        spinner.style.display = 'inline-block';
        button.disabled = true;
        
        fetch('/api/ai/product-recommendation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ productDesc: productDesc })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('recommendationText').innerText = data.recommendation;
            document.getElementById('recommendationResult').style.display = 'block';
            spinner.style.display = 'none';
            button.disabled = false;
        })
        .catch(error => {
            console.error('生成推荐语出错:', error);
            document.getElementById('recommendationText').innerText = '抱歉，服务出现了问题，请稍后再试。';
            document.getElementById('recommendationResult').style.display = 'block';
            spinner.style.display = 'none';
            button.disabled = false;
        });
    }

    function generateAnswer() {
        const productInfo = document.getElementById('productInfo').value.trim();
        const question = document.getElementById('customerQuestion').value.trim();
        
        if (productInfo === '' || question === '') return;

        const spinner = document.getElementById('qaSpinner');
        const button = document.getElementById('generateAnswerBtn');
        
        spinner.style.display = 'inline-block';
        button.disabled = true;
        
        fetch('/api/ai/product-qa', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ 
                productInfo: productInfo,
                question: question
            })
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('qaAnswerText').innerText = data.answer;
            document.getElementById('qaResult').style.display = 'block';
            spinner.style.display = 'none';
            button.disabled = false;
        })
        .catch(error => {
            console.error('生成回答出错:', error);
            document.getElementById('qaAnswerText').innerText = '抱歉，服务出现了问题，请稍后再试。';
            document.getElementById('qaResult').style.display = 'block';
            spinner.style.display = 'none';
            button.disabled = false;
        });
    }
</script>

</body>
