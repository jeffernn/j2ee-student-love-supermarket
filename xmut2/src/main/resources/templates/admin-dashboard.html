<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: header('管理员仪表板')}"></head>
<body>

<main class="container" th:insert="~{::content}">
    <div th:fragment="content">
        <div class="dashboard-container">
            <div class="panel-header">
                <h1 class="panel-title">管理员仪表板</h1>
                <p class="panel-subtitle">理工爱心超市管理系统</p>
            </div>
            
            <div class="panel-content">
                <div class="section-container">
                    <h2 class="section-title"><i class="fas fa-box"></i> 所有物品</h2>
                    <div class="table-responsive">
                        <table class="data-table" th:if="${items != null}">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>名称</th>
                                    <th>类别</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${items}">
                                    <td th:text="${item.id}"></td>
                                    <td th:text="${item.name}"></td>
                                    <td th:text="${item.category}"></td>
                                    <td>
                                        <span th:class="${item.isStored ? 'status-stored' : 'status-retrieved'}" 
                                              th:text="${item.isStored ? '已存' : '已取'}"></span>
                                    </td>
                                    <td>
                                        <div sec:authorize="hasRole('ADMIN')">
                                            <a th:href="@{/admin/edit-item(id=${item.id})}" class="btn-action">
                                                <i class="fas fa-edit"></i> 编辑
                                            </a>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                        <p class="empty-message" th:if="${#lists.isEmpty(items)}">暂无物品记录</p>
                    </div>
                </div>

                <div class="section-container">
                    <h2 class="section-title"><i class="fas fa-users"></i> 所有学生用户</h2>
                    <div class="table-responsive">
                        <table class="data-table" th:if="${users != null}">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>姓名</th>
                                    <th>卡号</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.name}"></td>
                                    <td th:text="${user.cardId}"></td>
                                </tr>
                            </tbody>
                        </table>
                        <p class="empty-message" th:if="${#lists.isEmpty(users)}">暂无学生用户</p>
                    </div>
                </div>

                <div class="section-container">
                    <h2 class="section-title"><i class="fas fa-cogs"></i> 操作</h2>
                    <div class="action-buttons">
                        <a href="/admin/records" class="btn-dashboard">
                            <i class="fas fa-list"></i> 查看取物记录
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    /* 隐藏顶部导航栏的主页按钮 */
    body header nav a[href$="/"] {
        display: none !important;
    }

    /* 通过类选择器确保隐藏 */
    body header nav .nav-link:not(.logout-link) {
        display: none !important;
    }

    /* ==================== 全局样式 ==================== */
    body {
        background-color: #f0f4f8;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #333;
        background-image: url('http://img.netbian.com/file/2024/0614/003651lvurh.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    
    /* ==================== 仪表板容器 ==================== */
    .dashboard-container {
        max-width: 1200px;
        margin: 30px auto;
        background-color: rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        padding: 0;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    /* ==================== 面板头部 ==================== */
    .panel-header {
        padding: 25px 0;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .panel-title {
        color: #2c3e50;
        margin: 0;
        font-size: 28px;
        font-weight: 600;
    }
    
    .panel-subtitle {
        color: #666;
        margin: 8px 0 0;
        font-size: 16px;
    }
    
    /* ==================== 面板内容 ==================== */
    .panel-content {
        padding: 30px;
        background-color: #ffffff;
    }
    
    /* ==================== 区块容器 ==================== */
    .section-container {
        margin-bottom: 30px;
        background-color: #f9f9f9;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    .section-title {
        color: #2c3e50;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eee;
    }
    
    .section-title i {
        margin-right: 8px;
        color: #2980b9;
    }
    
    /* ==================== 表格样式 ==================== */
    .table-responsive {
        overflow-x: auto;
    }
    
    .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
    }
    
    .data-table th, 
    .data-table td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #eee;
    }
    
    .data-table th {
        background-color: #f5f5f5;
        font-weight: 600;
        color: #333;
    }
    
    .data-table tr:hover {
        background-color: #f9f9f9;
    }
    
    .status-stored {
        background-color: #e3f5e6;
        color: #00812b;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 14px;
    }
    
    .status-retrieved {
        background-color: #feeeed;
        color: #d93025;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 14px;
    }
    
    .empty-message {
        text-align: center;
        color: #999;
        font-style: italic;
        padding: 20px;
    }
    
    /* ==================== 按钮样式 ==================== */
    .btn-action {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
    }
    
    .btn-action:hover {
        background-color: #1c5980;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    
    .btn-action i {
        margin-right: 5px;
    }
    
    .action-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    
    .btn-dashboard {
        display: inline-flex;
        align-items: center;
        padding: 10px 20px;
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    
    .btn-dashboard:hover {
        background-color: #1c5980;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }
    
    .btn-dashboard i {
        margin-right: 8px;
    }
    
    /* ==================== 响应式调整 ==================== */
    @media (max-width: 768px) {
        .dashboard-container {
            margin: 20px 15px;
        }
        
        .panel-content {
            padding: 20px;
        }
        
        .data-table th, 
        .data-table td {
            padding: 8px 10px;
            font-size: 14px;
        }
        
        .section-container {
            padding: 15px;
        }
    }
</style>

</body>
</html>
