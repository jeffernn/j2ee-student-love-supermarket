<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header('系统错误')}"></head>
<body>

<main class="container" th:insert="~{::content}">
    <div th:fragment="content">
        <div class="error-container">
            <div class="error-header">
                <h1 class="error-title">系统遇到了一些问题</h1>
                <p class="error-subtitle">理工爱心超市服务系统</p>
            </div>
            
            <div class="error-content">
                <div class="error-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                
                <div class="error-details">
                    <h2>错误详情</h2>
                    <div class="error-info">
                        <p><strong>错误信息:</strong> <span th:text="${error ?: '未知错误'}">未知错误</span></p>
                        <p><strong>状态码:</strong> <span th:text="${status ?: 'N/A'}">404</span></p>
                        <p><strong>详细信息:</strong> <span th:text="${message ?: '无可用详情'}">无可用详情</span></p>
                        <p th:if="${errorMessage}" class="custom-error-message"><span th:text="${errorMessage}">服务器处理请求时遇到了问题</span></p>
                    </div>
                    
                    <div class="error-actions">
                        <a href="/" class="btn-error">
                            <i class="fas fa-home"></i> 返回首页
                        </a>
                        <a href="javascript:history.back()" class="btn-error secondary">
                            <i class="fas fa-arrow-left"></i> 返回上一页
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
    /* ==================== 全局样式 ==================== */
    body {
        background-color: #f0f4f8;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #333;
        background-image: url('http://img.netbian.com/file/2024/0614/003651lvurh.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    
    /* ==================== 错误容器 ==================== */
    .error-container {
        max-width: 800px;
        margin: 80px auto;
        background-color: rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    /* ==================== 错误头部 ==================== */
    .error-header {
        padding: 25px 0;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .error-title {
        color: #e74c3c;
        margin: 0;
        font-size: 28px;
        font-weight: 600;
    }
    
    .error-subtitle {
        color: #666;
        margin: 8px 0 0;
        font-size: 16px;
    }
    
    /* ==================== 错误内容 ==================== */
    .error-content {
        padding: 40px;
        background-color: #ffffff;
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        align-items: center;
    }
    
    .error-icon {
        flex: 0 0 100px;
        height: 100px;
        background-color: rgba(231, 76, 60, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .error-icon i {
        font-size: 48px;
        color: #e74c3c;
    }
    
    .error-details {
        flex: 1;
        min-width: 300px;
    }
    
    .error-details h2 {
        margin-top: 0;
        margin-bottom: 20px;
        color: #2c3e50;
        font-size: 22px;
    }
    
    .error-info {
        background-color: #f9f9f9;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 25px;
    }
    
    .error-info p {
        margin: 10px 0;
        line-height: 1.6;
    }
    
    .error-info strong {
        color: #555;
    }
    
    .custom-error-message {
        padding: 12px 15px;
        background-color: #fdeaea;
        border-left: 4px solid #e74c3c;
        margin-top: 15px;
        color: #c0392b;
    }
    
    /* ==================== 错误操作 ==================== */
    .error-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
    }
    
    .btn-error {
        display: inline-flex;
        align-items: center;
        padding: 12px 25px;
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
    }
    
    .btn-error:hover {
        background-color: #1c5980;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }
    
    .btn-error.secondary {
        background-color: #95a5a6;
    }
    
    .btn-error.secondary:hover {
        background-color: #7f8c8d;
    }
    
    .btn-error i {
        margin-right: 8px;
    }
    
    /* ==================== 响应式调整 ==================== */
    @media (max-width: 768px) {
        .error-container {
            margin: 40px 15px;
        }
        
        .error-content {
            padding: 25px;
        }
        
        .error-icon {
            flex: 0 0 80px;
            height: 80px;
            margin: 0 auto;
        }
        
        .error-details {
            text-align: center;
        }
        
        .error-actions {
            justify-content: center;
        }
    }
</style>

</body>
</html>
