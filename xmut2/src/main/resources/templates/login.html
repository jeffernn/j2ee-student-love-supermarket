<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header('请登录')}"></head>
<body>

<main class="container" th:insert="~{::content}">
    <div th:fragment="content">
        <div class="login-container">
            <div class="login-header">
                <h1 class="login-title">理工爱心超市</h1>
                <p class="login-subtitle">请登录以继续</p>
            </div>
            
            <div class="login-form-container">
                <div class="error-message" th:if="${error}" th:text="${error}">未知错误</div>
                
                <form action="/login" method="post" class="login-form">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-id-card"></i> 校园卡号
                        </label>
                        <input type="text" id="username" name="username" required 
                               placeholder="请输入您的校园卡号" />
                    </div>
                    
                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> 密码
                        </label>
                        <input type="password" id="password" name="password" required 
                               placeholder="请输入您的密码" />
                    </div>
                    
                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> 登录
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<style>
    /* 全局样式 */
    body {
        background-color: #f0f4f8;
        font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #333;
        background-image: url('http://img.netbian.com/file/2024/0614/003651lvurh.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    /* 登录容器 */
    .login-container {
        width: 100%;
        max-width: 420px;
        margin: 20px;
        background-color: rgba(255, 255, 255, 0.6);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.3);
    }
    
    /* 登录头部 */
    .login-header {
        padding: 30px 20px;
        text-align: center;
        background-color: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .login-title {
        color: #2c3e50;
        margin: 0;
        font-size: 28px;
        font-weight: 600;
    }
    
    .login-subtitle {
        color: #666;
        margin: 8px 0 0;
        font-size: 16px;
    }
    
    /* 登录表单容器 */
    .login-form-container {
        padding: 30px;
        background-color: #ffffff;
    }
    
    /* 错误消息 */
    .error-message {
        background-color: #feeeed;
        color: #d93025;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        text-align: center;
    }
    
    /* 表单样式 */
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .form-group label {
        color: #2c3e50;
        font-weight: 500;
        font-size: 14px;
    }
    
    .form-group label i {
        margin-right: 8px;
        color: #2980b9;
    }
    
    .form-group input {
        padding: 12px;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
    }
    
    .form-group input:focus {
        border-color: #2980b9;
        box-shadow: 0 0 0 2px rgba(41, 128, 185, 0.1);
        outline: none;
    }
    
    .form-group input::placeholder {
        color: #999;
    }
    
    /* 登录按钮 */
    .btn-login {
        background-color: #2980b9;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 14px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .btn-login:hover {
        background-color: #1c5980;
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
    }
    
    .btn-login i {
        font-size: 18px;
    }
    
    /* 响应式调整 */
    @media (max-width: 480px) {
        .login-container {
            margin: 15px;
        }
        
        .login-header {
            padding: 20px 15px;
        }
        
        .login-form-container {
            padding: 20px;
        }
        
        .form-group input {
            padding: 10px;
        }
        
        .btn-login {
            padding: 12px;
        }
    }
</style>

</body>
</html>
